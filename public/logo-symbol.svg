<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="35%" stop-color="#DFBF85" />
      <stop offset="70%" stop-color="#C6A36A" />
      <stop offset="100%" stop-color="#916E34" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#172B25" />
      <stop offset="100%" stop-color="#C6A36A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Shield subtle luxury aura -->
  <circle cx="50" cy="50" r="46" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6" />
  
  <!-- Outer Stylized 'A' Arch -->
  <path d="M50 12 L82 82 L70 82 L50 38 L30 82 L18 82 Z" fill="url(#goldGrad)" />

  <!-- Mountain Peak inside the A -->
  <polygon points="50,42 66,76 34,76" fill="#172B25" opacity="0.9" />
  <polyline points="34,76 46,54 52,62 58,50 66,76" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Supersonic Luxury Airplane Silhouette banking across the peak -->
  <g transform="translate(48, 44) rotate(-35) scale(0.65)" filter="url(#glow)">
    <!-- Jet Fuselage -->
    <path d="M0 -22 C1.5 -16 2 12 0 16 C-2 12 -1.5 -16 0 -22 Z" fill="#FFFFFF" />
    <!-- Swept Wings -->
    <polygon points="0,-4 22,8 0,5 -22,8" fill="url(#goldGrad)" />
    <!-- Tail Fin -->
    <polygon points="0,8 8,17 0,16 -8,17" fill="url(#goldGrad)" />
  </g>

  <!-- Golden Orbit Swoosh / Contrail -->
  <path d="M22 66 Q38 48 58 40 T84 30" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
</svg>
