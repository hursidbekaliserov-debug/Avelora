<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="goldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="35%" stop-color="#DFBF85" />
      <stop offset="70%" stop-color="#C6A36A" />
      <stop offset="100%" stop-color="#916E34" />
    </linearGradient>
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Symbol Icon -->
  <g transform="translate(6, 6) scale(0.68)">
    <circle cx="50" cy="50" r="46" stroke="url(#goldGradFull)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6" />
    <path d="M50 12 L82 82 L70 82 L50 38 L30 82 L18 82 Z" fill="url(#goldGradFull)" />
    <polygon points="50,42 66,76 34,76" fill="#172B25" opacity="0.9" />
    <polyline points="34,76 46,54 52,62 58,50 66,76" fill="none" stroke="url(#goldGradFull)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(48, 44) rotate(-35) scale(0.65)" filter="url(#glowFull)">
      <path d="M0 -22 C1.5 -16 2 12 0 16 C-2 12 -1.5 -16 0 -22 Z" fill="#FFFFFF" />
      <polygon points="0,-4 22,8 0,5 -22,8" fill="url(#goldGradFull)" />
      <polygon points="0,8 8,17 0,16 -8,17" fill="url(#goldGradFull)" />
    </g>
    <path d="M22 66 Q38 48 58 40 T84 30" fill="none" stroke="url(#goldGradFull)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Typography Brand Name: AVELORA -->
  <text x="86" y="47" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="32" font-weight="700" letter-spacing="5" fill="url(#goldGradFull)">
    AVELORA
  </text>
  
  <!-- Subtitle -->
  <text x="88" y="64" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7.5" font-weight="500" letter-spacing="3.8" fill="#DFBF85" opacity="0.8">
    PREMIUM AI TRAVEL PLATFORM
  </text>
</svg>
